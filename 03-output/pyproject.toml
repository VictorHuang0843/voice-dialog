[project]
name = "voice-dialog-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "mcp>=1.17,<2.0",
    "numpy>=2.4.6",
    "setuptools<82",
    "sounddevice>=0.5.6",
    "webrtcvad>=2.0.10",
]
[project.scripts]
voice-dialog = "voice_dialog_mcp.server:cli"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# voice-dialog: never let the BlackHole loopback win
default_input_device = 1
